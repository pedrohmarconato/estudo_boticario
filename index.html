<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Marconato - Timeline de Carreira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header fixo -->
    <header class="header">
        <h1 class="header__title">Timeline de Carreira</h1>
        <div class="header__info">
            <span class="header__name">Pedro Marconato</span>
            <span class="header__role">Especialista em Analytics</span>
        </div>
    </header>

    <!-- Container principal -->
    <main class="main">
        <!-- Vista inicial: 4 colunas -->
        <div class="timeline" id="timeline">
            <article class="card" data-index="0">
                <div class="card__bg" style="background: linear-gradient(135deg, #011E38 0%, #264FEC 100%)"></div>
                <div class="card__content">
                    <span class="card__period">2019 - 2020</span>
                    <h2 class="card__company">Grupo RBS</h2>
                    <p class="card__position">Analista de Mercado</p>
                </div>
            </article>

            <article class="card" data-index="1">
                <div class="card__bg" style="background: linear-gradient(135deg, #264FEC 0%, #FFBC82 100%)"></div>
                <div class="card__content">
                    <span class="card__period">2020 - 2021</span>
                    <h2 class="card__company">DBC Company</h2>
                    <p class="card__position">Especialista em Dados</p>
                </div>
            </article>

            <article class="card" data-index="2">
                <div class="card__bg" style="background: linear-gradient(135deg, #FFBC82 0%, #F5F1EB 100%)"></div>
                <div class="card__content">
                    <span class="card__period">2021 - 2022</span>
                    <h2 class="card__company">Lojas Renner</h2>
                    <p class="card__position">Especialista em Dados</p>
                </div>
            </article>

            <article class="card" data-index="3">
                <div class="card__bg" style="background: linear-gradient(135deg, #F5F1EB 0%, #011E38 100%)"></div>
                <div class="card__content">
                    <span class="card__period">2022 - 2025</span>
                    <h2 class="card__company">Lojas Renner</h2>
                    <p class="card__position">Coordenador de CRM</p>
                </div>
            </article>
        </div>

        <!-- Vista expandida -->
        <div class="detail" id="detail">
            <button class="detail__close" id="closeBtn">&times;</button>

            <div class="detail__left">
                <span class="detail__period" id="detailPeriod"></span>
                <h2 class="detail__company" id="detailCompany"></h2>
                <p class="detail__position" id="detailPosition"></p>
                <p class="detail__description" id="detailDescription"></p>
            </div>

            <div class="detail__right">
                <div class="metrics" id="metrics"></div>
            </div>

            <nav class="detail__nav">
                <button class="detail__nav-btn" id="prevBtn">&larr;</button>
                <button class="detail__nav-btn" id="nextBtn">&rarr;</button>
            </nav>
        </div>
    </main>

    <!-- Side tab -->
    <div class="sidetab">
        <a href="case-analise.html" class="sidetab__link">
            <span>Nova Etapa</span>
            <span>&rarr;</span>
        </a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
